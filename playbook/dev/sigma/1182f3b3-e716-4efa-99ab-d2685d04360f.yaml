name: History File Deletion Investigation
id: a9f8c4e2-9b3d-4e56-8f2a-1c5b7d9e3f4b
description: |
  Investigates deletion of shell history files (bash_history, zsh_history, etc).
  History deletion can be legitimate system maintenance or malicious anti-forensics.
  This playbook helps determine intent and scope of the activity.
type: detection
detection_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2024-01-10
modified: 2024-01-10

questions:
  # Thread 1: Legitimacy Assessment (4 questions)
  # Determine if this is normal/authorized activity
  
  - question: What are the full details of this history deletion event?
    context: |
      Review the alert details to understand which history file was deleted and how. The deletion method (rm vs shred) can indicate intent.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: All alert fields available
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id|expand: '%document_id%'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - ParentImage

  - question: Is history deletion normal for this user?
    context: |
      Check if this user has deleted history files before to determine if this is normal behavior or unusual activity.
    range: -30d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30d (historical baseline)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User|expand: '%User%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - CommandLine

  - question: Does the timing align with legitimate maintenance windows?
    context: |
      Automated cleanup typically runs at consistent times while manual deletions during odd hours are more suspicious.
    range: -7d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -7d (recent patterns)
      # FIELD CHECK: hostname, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - User

  - question: Is this part of a system cleanup script or tool?
    context: |
      The parent process reveals if this was automated (cron, Ansible) or manual deletion. Manual deletion from a shell requires more scrutiny.
    range: -1h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h (recent context)
      # FIELD CHECK: ParentProcessGuid, ParentImage exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          ParentProcessGuid|expand: '%ParentProcessGuid%'
        condition: selection
      fields:
        - ParentImage
        - ParentCommandLine
        - Image
        - CommandLine

  # Thread 2: Activity Context (4 questions)
  # Understand what happened without assuming malice

  - question: What other commands did this user run before the deletion?
    context: |
      Commands before deletion reveal intent - look for reconnaissance or data access someone might want to hide.
    range: -30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m (pre-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        condition: selection
      fields:
        - Image
        - CommandLine

  - question: Were multiple history files or other logs deleted?
    context: |
      Single file deletion may be routine, but systematic deletion of multiple logs indicates deliberate anti-forensics.
    range: -15m/+15m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-15m (correlation window)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_targets:
          CommandLine|contains:
            - 'history'
            - '.log'
            - '/var/log/'
            - '.bash_'
            - '.zsh_'
        condition: all of selection*
      fields:
        - CommandLine

  - question: How did the user gain access to this system?
    context: |
      Check how the user authenticated - unusual sources or times combined with history deletion increase suspicion.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h (session context)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          Image|contains:
            - 'sshd'
            - 'login'
            - 'su'
            - 'sudo'
            - 'gdm'
            - 'kdm'
            - 'systemd'
        condition: selection
      fields:
        - Image
        - User

  - question: What file operations occurred after the deletion?
    context: |
      Activity after deletion shows intent - immediate logout suggests covering tracks while normal work resuming indicates legitimate use.
    range: +30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +30m (post-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        condition: selection
      fields:
        - Image
        - CommandLine

  # Thread 3: Impact Assessment (3 questions)
  # Determine scope and risk if unauthorized

  - question: Were any network connections made around this time?
    context: |
      External connections near history deletion may indicate data exfiltration. Internal connections suggest lateral movement.
    range: -30m/+30m
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: +/-30m (correlation window)
      # FIELD CHECK: hostname, User exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        condition: selection
      fields:
        - DestinationIp
        - DestinationPort
        - Image

  - question: Were sensitive files accessed before the deletion?
    context: |
      Check if sensitive files (SSH keys, credentials, passwords) were accessed before deletion - this combination often indicates malicious activity.
    range: -1h
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -1h (pre-deletion activity)
      # FIELD CHECK: hostname, User exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        selection_sensitive:
          TargetFilename|contains:
            - '.ssh/'
            - '.aws/'
            - 'passwd'
            - 'shadow'
            - '.key'
            - '.pem'
            - 'credentials'
            - 'config'
        condition: all of selection*
      fields:
        - TargetFilename

  - question: Has this deletion pattern occurred on other systems?
    context: |
      Similar deletion patterns on multiple systems indicate a campaign rather than an isolated incident.
    range: -24h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -24h (campaign window)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User|expand: '%User%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - hostname

  # Thread 4: Investigative Deep-Dive (3 questions)
  # Detailed investigation if earlier threads show risk

  - question: Were any anti-forensics tools or techniques used?
    context: |
      Look for advanced cleanup like shred, timestamp manipulation, or clearing multiple logs - these indicate sophisticated attackers.
    range: -2h/+2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-2h (extended correlation)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        selection_tools:
          - Image|endswith:
              - '/shred'
              - '/wipe'
              - '/secure-delete'
              - '/srm'
              - '/dd'
          - CommandLine|contains:
              - 'timestomp'
              - '/dev/null'
              - '/dev/zero'
              - 'touch -t'
              - 'utmpdump'
        condition: all of selection*
      fields:
        - Image
        - CommandLine

  - question: Were any privilege escalation attempts made?
    context: |
      Privilege escalation before history deletion is highly suspicious since elevated permissions are needed to clear certain logs.
    range: -4h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -4h (privilege escalation window)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        selection_privesc:
          - Image|contains:
              - 'sudo'
              - 'su'
              - 'pkexec'
              - 'doas'
          - CommandLine|contains:
              - 'setuid'
              - 'chmod +s'
              - '/etc/passwd'
              - '/etc/shadow'
              - 'kernel'
              - 'exploit'
        condition: all of selection*
      fields:
        - Image
        - CommandLine
        - User