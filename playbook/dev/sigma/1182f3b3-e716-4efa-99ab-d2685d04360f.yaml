name: History File Deletion Investigation
id: a9f8c4e2-9b3d-4e56-8f2a-1c5b7d9e3f4b
description: |
  Investigates deletion of shell history files (bash_history, zsh_history, etc).
  History deletion can be legitimate system maintenance or malicious anti-forensics.
  This playbook helps determine intent and scope of the activity.
type: detection
detection_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2024-01-10
modified: 2024-01-10

questions:
  # Thread 1: Legitimacy Assessment (4 questions)
  # Determine if this is normal/authorized activity
  
  - question: What are the full details of this history deletion event?
    context: |
      Examines the alert details to understand exactly what occurred.
      Shows the specific command, user, and process information.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: All alert fields available
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - CreationUtcTime
        - hostname
        - User
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine
        - ParentUser
        - ProcessGuid
        - ParentProcessGuid

  - question: Is history deletion normal for this user?
    context: |
      Checks if this user has deleted history files before.
      Regular history cleanup may indicate maintenance scripts or privacy practices.
      First-time deletion could be more suspicious.
    range: -30d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30d (historical baseline)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - CommandLine

  - question: Does the timing align with legitimate maintenance windows?
    context: |
      History deletion during business hours by regular users is more suspicious.
      After-hours deletion by admins may be routine maintenance.
      Check if this aligns with known maintenance schedules.
    range: -7d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -7d (recent patterns)
      # FIELD CHECK: hostname, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - User
        - CommandLine

  - question: Is this part of a system cleanup script or tool?
    context: |
      Some legitimate tools and scripts routinely clean history files.
      Configuration management, privacy tools, or cleanup utilities may do this.
      Check parent process to identify automated vs manual deletion.
    range: -1h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h (recent context)
      # FIELD CHECK: ParentProcessGuid, ParentImage exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          ParentProcessGuid: '{ParentProcessGuid}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - User

  # Thread 2: Activity Context (4 questions)
  # Understand what happened without assuming malice

  - question: What other commands did this user run before the deletion?
    context: |
      Shows user activity leading up to history deletion.
      Suspicious commands followed by deletion suggest covering tracks.
      Normal work followed by deletion may be routine cleanup.
    range: -30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m (pre-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  - question: Were multiple history files or other logs deleted?
    context: |
      Deletion of multiple history/log files indicates thorough cleanup.
      Single file deletion may be accidental or targeted.
      Multiple deletions across different shells suggests anti-forensics.
    range: -15m/+15m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-15m (correlation window)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_targets:
          CommandLine|contains:
            - 'history'
            - '.log'
            - '/var/log/'
            - '.bash_'
            - '.zsh_'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - CommandLine
        - Image

  - question: How did the user gain access to this system?
    context: |
      Understanding the authentication source helps assess legitimacy.
      Local console vs remote access has different risk profiles.
      Unusual access methods before deletion increase suspicion.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h (session context)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
          Image|contains:
            - 'sshd'
            - 'login'
            - 'su'
            - 'sudo'
            - 'gdm'
            - 'kdm'
            - 'systemd'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  - question: What file operations occurred after the deletion?
    context: |
      Activity after deletion reveals intent.
      Immediate logout suggests quick cleanup.
      Continued suspicious activity indicates ongoing compromise.
    range: +30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +30m (post-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  # Thread 3: Impact Assessment (3 questions)
  # Determine scope and risk if unauthorized

  - question: Were any network connections made around this time?
    context: |
      Network activity near history deletion may indicate data exfiltration.
      Connections to external IPs are particularly concerning.
      Internal connections might show lateral movement.
    range: -30m/+30m
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: +/-30m (correlation window)
      # FIELD CHECK: hostname, User exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - DestinationIp
        - DestinationPort
        - Image

  - question: Were sensitive files accessed before the deletion?
    context: |
      File access before history deletion may indicate data theft.
      Access to passwords, keys, or confidential data increases risk.
      Pattern helps determine if deletion was to hide specific activity.
    range: -1h
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -1h (pre-deletion activity)
      # FIELD CHECK: hostname, User exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_sensitive:
          TargetFilename|contains:
            - '.ssh/'
            - '.aws/'
            - 'passwd'
            - 'shadow'
            - '.key'
            - '.pem'
            - 'credentials'
            - 'config'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - TargetFilename
        - Image

  - question: Has this deletion pattern occurred on other systems?
    context: |
      Similar deletions across multiple systems suggest campaign activity.
      Isolated deletion may be single compromised account.
      Pattern analysis helps scope the incident.
    range: -24h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -24h (campaign window)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - hostname
        - CreationUtcTime

  # Thread 4: Investigative Deep-Dive (3 questions)
  # Detailed investigation if earlier threads show risk

  - question: Were any anti-forensics tools or techniques used?
    context: |
      Sophisticated attackers use multiple anti-forensics techniques.
      Look for secure deletion tools, timestamp manipulation, or log tampering.
      These activities together with history deletion indicate advanced threats.
    range: -2h/+2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-2h (extended correlation)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_tools:
          - Image|endswith:
              - '/shred'
              - '/wipe'
              - '/secure-delete'
              - '/srm'
              - '/dd'
          - CommandLine|contains:
              - 'timestomp'
              - '/dev/null'
              - '/dev/zero'
              - 'touch -t'
              - 'utmpdump'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - Image
        - CommandLine

  - question: Were any privilege escalation attempts made?
    context: |
      Attackers often escalate privileges before covering tracks.
      History deletion by newly privileged accounts is highly suspicious.
      Check for sudo usage, setuid binaries, or kernel exploits.
    range: -4h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -4h (privilege escalation window)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_privesc:
          - Image|contains:
              - 'sudo'
              - 'su'
              - 'pkexec'
              - 'doas'
          - CommandLine|contains:
              - 'setuid'
              - 'chmod +s'
              - '/etc/passwd'
              - '/etc/shadow'
              - 'kernel'
              - 'exploit'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - User