name: Linux History File Deletion Investigation
id: a7f8c4e2-9b3d-4e56-8f2a-1c5b7d9e3f4a
description: |
  This playbook guides the investigation of Linux history file deletion events, which are commonly used by attackers to remove traces of their malicious activities. History file deletion is a critical anti-forensics technique that can indicate post-exploitation activity, covering tracks after unauthorized access, or preparation for malicious actions.
type: detection
detection_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2025-01-27
modified: 2025-01-27
questions:
  # Phase 1: Alert Context (Required)
  - question: What exact command triggered the history file deletion alert?
    context: |
      The full command line provides details about which history file was deleted, the method used (rm, unlink, shred), and any command flags that might indicate the attacker's intent or sophistication level.
    range: ''
    answer_sources:
      - process_creation
    query: |
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - CommandLine
        - Image
        - User
        - CurrentDirectory
        - CreationUtcTime

  - question: What user and parent process was involved in the history deletion?
    context: |
      Understanding the user context and parent process helps determine if this was a privileged escalation attack, a compromised user account, or potentially legitimate administrative activity. The parent process reveals how the deletion was initiated.
    range: ''
    answer_sources:
      - process_creation
    query: |
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - User
        - ParentImage
        - ParentCommandLine
        - ParentProcessGuid
        - IntegrityLevel

  # Phase 2: Tool-Specific Analysis (Evasion/Anti-Forensics Category)
  - question: What other anti-forensics or log tampering activities occurred around this event?
    context: |
      Attackers often combine history deletion with other anti-forensics techniques like log clearing, timestamp manipulation, or security tool tampering. This query identifies related evasion activities.
    range: +/-15m
    answer_sources:
      - process_creation
    query: |
      aggregation: true
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - '/var/log/'
            - 'journalctl'
            - 'dmesg -c'
            - 'echo > '
            - 'truncate -s'
            - 'history -c'
            - 'export HISTFILE'
            - 'unset HISTFILE'
            - 'HISTSIZE=0'
            - 'shred'
            - 'wipe'
            - 'secure-delete'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - ParentImage

  - question: Were any shell configuration files modified to disable history logging?
    context: |
      Sophisticated attackers may modify shell configuration files (.bashrc, .bash_profile, .zshrc) to disable history logging before conducting malicious activities, preventing future command logging.
    range: +/-30m
    answer_sources:
      - file_event
    query: |
      aggregation: false
      logsource:
        category: file_event
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
          TargetFilename|endswith:
            - '.bashrc'
            - '.bash_profile'
            - '.bash_logout'
            - '.zshrc'
            - '.zsh_profile'
            - '.profile'
            - '/etc/profile'
            - '/etc/bash.bashrc'
        condition: selection
      fields:
        - User
        - Image
        - TargetFilename
        - CreationUtcTime

  # Phase 3: Process Analysis (Required)
  - question: What child processes were spawned by the history deletion process?
    context: |
      Child processes can reveal if the history deletion was part of a larger script or if additional cleanup activities were performed after the deletion.
    range: +5m
    answer_sources:
      - process_creation
    query: |
      aggregation: false
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          ParentProcessGuid: '{event_data.process.entity_id}'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - IntegrityLevel
        - CreationUtcTime

  - question: What other suspicious processes executed around the time of history deletion?
    context: |
      Examining processes before and after history deletion can reveal the malicious activities the attacker was trying to hide, including reconnaissance, exploitation, or data exfiltration commands.
    range: +/-10m
    answer_sources:
      - process_creation
    query: |
      aggregation: true
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
        filter_suspicious:
          - Image|endswith:
              - '/wget'
              - '/curl'
              - '/nc'
              - '/netcat'
              - '/nmap'
              - '/tcpdump'
              - '/ssh'
              - '/scp'
              - '/rsync'
          - CommandLine|contains:
              - '/dev/tcp/'
              - 'bash -i'
              - 'sh -i'
              - 'mkfifo'
              - 'base64'
              - 'python -c'
              - 'perl -e'
              - 'ruby -e'
        condition: selection and filter_suspicious
      fields:
        - User
        - ParentImage
        - Image
        - CommandLine
        - CreationUtcTime

  # Phase 4: System Context (Required)
  - question: What network connections were established around the history deletion?
    context: |
      Network connections can indicate command and control communications, data exfiltration, or lateral movement activities that the attacker was attempting to hide by deleting history files.
    range: +/-10m
    answer_sources:
      - network_connection
    query: |
      aggregation: true
      logsource:
        category: network_connection
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
        filter_external:
          DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
            - '192.168.'
            - '127.'
        condition: selection and not filter_external
      fields:
        - Image
        - User
        - DestinationIp
        - DestinationPort
        - Protocol

  - question: What files were created, modified, or accessed in suspicious locations?
    context: |
      File system activity can reveal persistence mechanisms, malware deployment, or sensitive data access that occurred before the attacker attempted to cover their tracks.
    range: +/-10m
    answer_sources:
      - file_event
    query: |
      aggregation: true
      logsource:
        category: file_event
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
        filter_suspicious:
          TargetFilename|contains:
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'
            - '/etc/cron'
            - '/etc/systemd/system/'
            - '/.ssh/'
            - '/root/'
            - '.sh'
            - '.py'
            - '.pl'
            - '.rb'
        condition: selection and filter_suspicious
      fields:
        - Image
        - User
        - TargetFilename
        - CreationUtcTime

  # Phase 5: Historical Analysis (Required)
  - question: Has this specific tool been executed on this host before?
    context: |
      Historical patterns can reveal if this is a repeated attack pattern, ongoing campaign, or if the system has been previously compromised. This helps assess the scope and timeline of potential compromise.
    range: -90d
    answer_sources:
      - process_creation
    query: |
      # Detection ID: 1182f3b3-e716-4efa-99ab-d2685d04360f
      # Efficient pattern: Using exact Image from alert instead of recreating detection logic
      aggregation: true
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
          Image: '{process.executable}'  # Use the exact Image that triggered the alert
        condition: selection
      fields:
        - User
        - ParentImage
        - CommandLine
        - CreationUtcTime

  - question: Is this specific tool being executed on other hosts in the environment?
    context: |
      Similar activity across multiple hosts can indicate lateral movement, widespread compromise, or an active attack campaign targeting the organization.
    range: -7d
    answer_sources:
      - process_creation
    query: |
      # Detection ID: 1182f3b3-e716-4efa-99ab-d2685d04360f
      # Efficient pattern: Using exact Image from alert instead of recreating detection logic
      aggregation: true
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          Image: '{process.executable}'  # Use the exact Image that triggered the alert
        filter:
          hostname: '{event_data.host.name}'
        condition: selection and not filter
      fields:
        - hostname
        - User
        - ParentImage
        - CommandLine
        - CreationUtcTime

  # Phase 6: Threat Intelligence & Impact Assessment (Optional)
  - question: What is the baseline behavior for history-related commands on this host?
    context: |
      Understanding normal history file operations helps distinguish between legitimate administrative tasks and malicious activity. Some systems may have automated cleanup scripts that legitimately manage history files.
    range: -30d
    answer_sources:
      - process_creation
    query: |
      aggregation: true
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - 'history'
            - 'HISTFILE'
            - 'HISTSIZE'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - ParentImage
        - count() as frequency

  - question: Were any tools or scripts downloaded before the history deletion?
    context: |
      Attackers often download and execute tools before attempting to cover their tracks. Identifying downloaded content can reveal attack tools, scripts, or malware that was deployed.
    range: -1h
    answer_sources:
      - process_creation
    query: |
      aggregation: false
      logsource:
        category: process_creation
        product: linux
      detection:
        selection:
          hostname: '{event_data.host.name}'
        download_tools:
          Image|endswith:
            - '/wget'
            - '/curl'
            - '/git'
        download_commands:
          CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
            - '.sh'
            - '.py'
            - '.pl'
            - 'github.com'
            - 'pastebin'
            - 'raw.githubusercontent'
        condition: selection and (download_tools or download_commands)
      fields:
        - User
        - Image
        - CommandLine
        - CreationUtcTime