name: History File Deletion Investigation
id: a9f8c4e2-9b3d-4e56-8f2a-1c5b7d9e3f4b
description: |
  Investigates deletion of shell history files (bash_history, zsh_history, etc).
  History deletion can be legitimate system maintenance or malicious anti-forensics.
  This playbook helps determine intent and scope of the activity.
type: detection
detection_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2024-01-10
modified: 2024-01-10

questions:
  # Thread 1: Legitimacy Assessment (4 questions)
  # Determine if this is normal/authorized activity
  
  - question: What are the full details of this history deletion event?
    context: |
      Start by understanding exactly what triggered this alert - which history file was deleted, by whom, and how. This helps determine if it's routine maintenance or unauthorized activity. The deletion method (rm vs shred) can indicate intent.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: All alert fields available
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - CreationUtcTime
        - hostname
        - User
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine
        - ParentUser
        - ProcessGuid
        - ParentProcessGuid

  - question: Is history deletion normal for this user?
    context: |
      Historical patterns show whether this is unusual behavior. A developer who regularly cleans history files as part of their workflow differs from a service account suddenly deleting logs. Look for frequency and consistency - is this a monthly habit or a one-time event?
    range: -30d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30d (historical baseline)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - CommandLine

  - question: Does the timing align with legitimate maintenance windows?
    context: |
      Timing helps assess intent. Automated cleanup scripts typically run at consistent times, while manual deletions during odd hours need closer inspection. Consider both the day of week and time of day - weekend maintenance is common, but 3am deletions on a Tuesday might indicate unauthorized access.
    range: -7d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -7d (recent patterns)
      # FIELD CHECK: hostname, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - User
        - CommandLine

  - question: Is this part of a system cleanup script or tool?
    context: |
      The parent process reveals whether this deletion was automated or manual. Legitimate cleanup often comes from cron jobs, configuration management tools like Ansible, or privacy utilities. Manual deletion from an interactive shell session requires more scrutiny, especially if preceded by suspicious commands.
    range: -1h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h (recent context)
      # FIELD CHECK: ParentProcessGuid, ParentImage exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          ParentProcessGuid: '{ParentProcessGuid}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - User

  # Thread 2: Activity Context (4 questions)
  # Understand what happened without assuming malice

  - question: What other commands did this user run before the deletion?
    context: |
      The commands preceding history deletion often show intent. Look for reconnaissance activities, privilege escalation attempts, or data access that someone might want to hide. Normal development work or system administration tasks followed by cleanup suggests legitimate use.
    range: -30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m (pre-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  - question: Were multiple history files or other logs deleted?
    context: |
      The scope of deletion activity is telling. A single .bash_history removal might be accidental or routine, but systematic deletion of multiple history files, auth logs, and system logs indicates deliberate anti-forensics. Watch for patterns like clearing bash, zsh, and fish histories in sequence.
    range: -15m/+15m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-15m (correlation window)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_targets:
          CommandLine|contains:
            - 'history'
            - '.log'
            - '/var/log/'
            - '.bash_'
            - '.zsh_'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - CommandLine
        - Image

  - question: How did the user gain access to this system?
    context: |
      Authentication context helps establish legitimacy. A user logging in from their usual workstation IP is different from access through a compromised service account or unusual SSH source. Check for authentication anomalies like new source IPs, unusual times, or privilege escalation shortly after login.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h (session context)
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
          Image|contains:
            - 'sshd'
            - 'login'
            - 'su'
            - 'sudo'
            - 'gdm'
            - 'kdm'
            - 'systemd'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  - question: What file operations occurred after the deletion?
    context: |
      Post-deletion activity reveals whether this was a one-time cleanup or part of ongoing malicious activity. Quick logout after deletion might indicate hit-and-run tactics, while continued reconnaissance or lateral movement suggests active compromise. Normal work resuming after deletion often indicates legitimate use.
    range: +30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +30m (post-event activity)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - ParentImage

  # Thread 3: Impact Assessment (3 questions)
  # Determine scope and risk if unauthorized

  - question: Were any network connections made around this time?
    context: |
      Network connections can indicate data exfiltration or command and control activity. External connections to unusual ports or IPs around the time of history deletion suggest someone hiding evidence of data theft. Internal connections might indicate lateral movement attempts after gaining initial access.
    range: -30m/+30m
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: +/-30m (correlation window)
      # FIELD CHECK: hostname, User exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        condition: selection
      fields:
        - DestinationIp
        - DestinationPort
        - Image

  - question: Were sensitive files accessed before the deletion?
    context: |
      File access patterns before history deletion can show what someone was trying to hide. Check for access to SSH keys, cloud credentials, password files, or business data. Sensitive file access followed by history deletion often indicates malicious activity.
    range: -1h
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -1h (pre-deletion activity)
      # FIELD CHECK: hostname, User exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_sensitive:
          TargetFilename|contains:
            - '.ssh/'
            - '.aws/'
            - 'passwd'
            - 'shadow'
            - '.key'
            - '.pem'
            - 'credentials'
            - 'config'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - TargetFilename
        - Image

  - question: Has this deletion pattern occurred on other systems?
    context: |
      Checking for similar activity across your environment helps determine if you're dealing with an isolated incident or a broader campaign. Attackers often use consistent techniques across multiple compromised systems. Finding the same deletion patterns on other hosts indicates systematic activity requiring immediate response.
    range: -24h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -24h (campaign window)
      # FIELD CHECK: User, Image, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User: '{user.name}'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          - CommandLine|contains:
              - '/.bash_history'
              - '/.zsh_history'
          - CommandLine|endswith:
              - '_history'
              - '.history'
              - 'zhistory'
        condition: all of selection*
      fields:
        - hostname
        - CreationUtcTime

  # Thread 4: Investigative Deep-Dive (3 questions)
  # Detailed investigation if earlier threads show risk

  - question: Were any anti-forensics tools or techniques used?
    context: |
      Attackers often use multiple anti-forensics techniques to hide their tracks. Beyond simple deletion, look for secure wiping tools like shred or dd, timestamp manipulation to hide file changes, or attempts to clear other system logs. The cleanup methods used can indicate the attacker's skill level.
    range: -2h/+2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: +/-2h (extended correlation)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_tools:
          - Image|endswith:
              - '/shred'
              - '/wipe'
              - '/secure-delete'
              - '/srm'
              - '/dd'
          - CommandLine|contains:
              - 'timestomp'
              - '/dev/null'
              - '/dev/zero'
              - 'touch -t'
              - 'utmpdump'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - Image
        - CommandLine

  - question: Were any privilege escalation attempts made?
    context: |
      Privilege escalation often precedes anti-forensics activities since elevated permissions are needed to clear certain logs. Look for sudo commands, exploitation of setuid binaries, or kernel exploits in the hours before history deletion. A regular user suddenly gaining root access and then deleting history files indicates likely compromise.
    range: -4h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -4h (privilege escalation window)
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{user.name}'
        selection_privesc:
          - Image|contains:
              - 'sudo'
              - 'su'
              - 'pkexec'
              - 'doas'
          - CommandLine|contains:
              - 'setuid'
              - 'chmod +s'
              - '/etc/passwd'
              - '/etc/shadow'
              - 'kernel'
              - 'exploit'
        condition: all of selection*
      fields:
        - CreationUtcTime
        - Image
        - CommandLine
        - User