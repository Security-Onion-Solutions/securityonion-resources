name: History File Deletion
id: 1182f3b3-e716-4efa-99ab-d2685d04360f
description: |
  Detects deletion of command history files (e.g., .bash_history, .zsh_history).
  While sometimes legitimate for privacy or maintenance, this is commonly used 
  by attackers to hide their activities.
type: detection
detection_id: 1182f3b3-e716-4efa-99ab-d2685d04360f
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2024-01-20
modified: 2024-01-20

questions:
  # Thread 1: Legitimacy Assessment (3 questions)
  - question: Is this expected administrative activity?
    context: |
      System administrators may clear history during maintenance or cleanup.
      Check if this aligns with scheduled activities.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: All alert fields available
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id|expand: '%document_id%'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine

  - question: Does this user typically perform system maintenance?
    context: |
      History deletion by non-administrative users is more suspicious.
    range: -30d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30d
      # FIELD CHECK: User, Image exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          User|expand: '%User%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        condition: selection
      fields:
        - Image
        - CommandLine

  - question: Has this user deleted history files before?
    context: |
      Regular history deletion might be policy, while first-time deletion is suspicious.
    range: -90d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -90d
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection_image:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
        selection_history:
          CommandLine|contains:
            - 'history'
        condition: all of selection*
      fields:
        - CommandLine

  # Thread 2: Activity Context (4 questions)
  - question: What was the user doing before deleting history?
    context: |
      Commands executed before deletion often reveal what's being hidden.
    range: -30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        condition: selection
      fields:
        - Image
        - CommandLine

  - question: What shell or terminal spawned the deletion command?
    context: |
      Remote shells or unusual terminals suggest unauthorized access.
    range: -5m/+1m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -5m/+1m
      # FIELD CHECK: hostname, ProcessGuid exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          ProcessGuid|expand: '%ProcessGuid%'
        condition: selection
      fields:
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine

  - question: Were other anti-forensic activities performed?
    context: |
      Attackers often combine history deletion with log clearing and file removal.
    range: -1h/+30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h/+30m
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          CommandLine|contains:
            - '/var/log/'
            - 'journalctl'
            - 'truncate'
            - 'echo >'
            - '/dev/null'
            - 'rm -rf'
        condition: selection
      fields:
        - Image
        - CommandLine

  - question: How did the user authenticate to this system?
    context: |
      Recent SSH or sudo activity helps identify the access method.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          Image|endswith:
            - '/sshd'
            - '/sudo'
            - '/su'
            - '/login'
        condition: selection
      fields:
        - Image
        - CommandLine
        - ParentImage

  # Thread 3: Impact Assessment (3 questions)
  - question: Were sensitive commands potentially hidden?
    context: |
      Check for privilege escalation, data access, or system modification before deletion.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          CommandLine|contains:
            - 'passwd'
            - 'shadow'
            - 'sudoers'
            - 'chmod'
            - 'chown'
            - 'useradd'
            - 'groupadd'
        condition: selection
      fields:
        - Image
        - CommandLine

  - question: Did the user access or exfiltrate data?
    context: |
      Data theft often precedes history deletion to hide evidence.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          CommandLine|contains:
            - 'tar '
            - 'zip '
            - 'scp '
            - 'rsync'
            - 'curl '
            - 'wget '
            - 'nc '
        condition: selection
      fields:
        - CommandLine

  - question: Were other history or log files targeted?
    context: |
      Comprehensive anti-forensics suggests sophisticated attack.
    range: -30m/+30m
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -30m/+30m
      # FIELD CHECK: hostname exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname|expand: '%hostname%'
          TargetFilename|contains:
            - 'history'
            - '.log'
            - 'auth'
            - 'secure'
            - 'messages'
        condition: selection
      fields:
        - User
        - TargetFilename
        - Image

  # Thread 4: Investigative Deep-Dive (4 questions)
  - question: Did the user establish persistence mechanisms?
    context: |
      Attackers may install backdoors before clearing their tracks.
    range: -2h
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -2h
      # FIELD CHECK: hostname, User exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
          TargetFilename|contains:
            - '/etc/cron'
            - '/.ssh/authorized_keys'
            - '/etc/systemd/'
            - '/.bashrc'
            - '/.profile'
            - '/etc/passwd'
        condition: selection
      fields:
        - TargetFilename
        - Image

  - question: Were network connections made to suspicious destinations?
    context: |
      Outbound connections might indicate C2 communication or data exfiltration.
    range: -2h/+30m
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: -2h/+30m
      # FIELD CHECK: hostname, User exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        filter:
          DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '192.168.'
            - '127.'
        condition: selection and not filter
      fields:
        - DestinationIp
        - DestinationPort
        - Image

  - question: Were suspicious tools or scripts executed?
    context: |
      Look for reconnaissance, exploitation, or post-exploitation tools.
    range: -2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h
      # FIELD CHECK: hostname exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          CommandLine|contains:
            - 'nmap'
            - 'masscan'
            - 'linpeas'
            - 'linenum'
            - 'mimipenguin'
            - 'lazagne'
            - 'procdump'
            - '/dev/tcp/'
            - 'python -c'
            - 'perl -e'
        condition: selection
      fields:
        - User
        - CommandLine

  - question: Was this part of a scripted attack?
    context: |
      Automated tools often have patterns in timing and command structure.
    range: -30m/+30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m/+30m
      # FIELD CHECK: hostname, ParentImage exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname|expand: '%hostname%'
          ParentImage|expand: '%ParentImage%'
        condition: selection
      fields:
        - Image
        - User

  # Thread 5: Enterprise Context (2 questions)
  - question: Have similar history deletions occurred on other systems?
    context: |
      Coordinated deletions across systems indicate campaign activity.
    range: -24h
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert
      # RANGE CHECK: -24h
      # FIELD CHECK: rule.name exist in alert
      aggregation: true
      logsource:
        category: alert
      detection:
        selection:
          rule.name: 'History File Deletion'
        condition: selection
      fields:
        - hostname
        - User

  - question: Are there related security alerts for this user or system?
    context: |
      History deletion often occurs alongside other malicious activities.
    range: -24h
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert
      # RANGE CHECK: -24h
      # FIELD CHECK: hostname, User exist in alert
      aggregation: true
      logsource:
        category: alert
      detection:
        selection:
          hostname|expand: '%hostname%'
          User|expand: '%User%'
        condition: selection
      fields:
        - rule.name
        - severity