name: Renamed Whoami Execution
id: 9a1b2c3d-4e5f-6789-0abc-def012345678
description: |
    Detects the execution of whoami that has been renamed to a different name to avoid detection. This technique is commonly used by malware and adversaries to gather system user information while attempting to evade detection.
type: detection
detection_id: 'f1086bf7-a0c4-4a37-9102-01e573caf4a0'
detection_category: ''
detection_type: 'sigma'
contributors:
  - 'SecurityOnionSolutions'
date: 2025-04-03
questions:
  - question: 'What is the full path and name of the renamed whoami executable?'
    context: 'Understanding the renamed executable location and name can help identify the method of deployment and potential related malware.'
    answer_sources:
        - process_creation
    query: |
        aggregation: false
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
               ProcessGuid: '{event_data.process.entity_id}'
            condition: selection
        fields:
            - Image
            - CommandLine
            - CurrentDirectory
  - question: 'What user account executed the renamed whoami process?'
    context: 'This can give perspective on legitimate executions - for example, some software runs whoami as part of its startup initialization.'
    answer_sources:
        - process_creation
    query: |
        aggregation: false
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
               ProcessGuid: '{event_data.process.entity_id}'
            condition: selection
        fields:
            - User
  - question: 'What processes were spawned by the renamed whoami executable?'
    context: 'Child processes can reveal additional malicious activity or command and control behavior.'
    range: +5m
    answer_sources:
        - process_creation
    query: |
        aggregation: false
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
                ParentProcessGuid: '{event_data.process.entity_id}'
            condition: selection
        fields:
            - Image
            - CommandLine
            - User
  - question: 'What network connections were established around the time of execution?'
    context: 'Network connections temporally close to the whoami execution may surface malicious activity like C2.'
    range: +/-2m
    answer_sources:
        - network_connection
    query: |
        aggregation: true
        logsource:
          category: network_connection
          product: windows
        detection:
            selection:
                hostname: '{event_data.host.name}'
            condition: selection
        fields:
            - Image
            - DestinationIp
            - DestinationPort
  - question: 'What other suspicious processes executed on the host within 10 minutes of the alert?'
    context: 'Related suspicious processes can indicate broader attack patterns or malware behavior.'
    range: +/-10m
    answer_sources:
        - process_creation
    query: |
        aggregation: true
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
                hostname: '{event_data.host.name}'
            condition: selection
        fields:
            - User
            - Image
            - CommandLine
  - question: 'Are there any file modifications in the directory where the renamed whoami was executed?'
    context: 'File system activity in the same directory may reveal malware droppers or other malicious artifacts.'
    range: +/-5m
    answer_sources:
        - file_event
    query: |
        aggregation: false
        logsource:
          category: file_event
          product: windows
        detection:
            selection:
                FilePath|contains: '{event_data.process.working_directory}'
            condition: selection
        fields:
            - User
            - Image
            - TargetFilename
  - question: 'Have there been other whoami executions (renamed or not) on this host in the past 7 days?'
    context: 'Historical whoami execution patterns can help establish if this is part of a broader campaign.'
    range: -7d
    answer_sources:
        - process_creation
    query: |
        aggregation: false
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
                OriginalFileName: 'whoami.exe'
            condition: selection
        fields:
            - Image
            - CommandLine
            - User
            - ParentImage

  - question: 'What other hosts in the environment have executed whoami (renamed or not) in the past 24 hours?'
    context: 'Network-wide whoami execution patterns can indicate lateral movement or broader compromise.'
    range: -24h
    answer_sources:
        - process_creation
    query: |
        aggregation: true
        logsource:
          category: process_creation
          product: windows
        detection:
            selection:
                OriginalFileName: 'whoami.exe'
            condition: selection
        fields:
            - hostname
            - User
            - CommandLine
