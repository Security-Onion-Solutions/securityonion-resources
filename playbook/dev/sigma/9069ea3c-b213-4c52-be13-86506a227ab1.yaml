name: Linux Crypto Mining Indicators
id: 9069ea3c-b213-4c52-be13-86506a227ab1
description: |
  Detects command line parameters or strings often used by crypto miners.
  While crypto mining itself is not inherently malicious, unauthorized mining 
  can indicate compromise or resource abuse.
type: detection
detection_id: 9069ea3c-b213-4c52-be13-86506a227ab1
detection_type: sigma
contributors:
  - SecurityOnionSolutions
date: 2024-01-20
modified: 2024-01-20

questions:
  # Thread 1: Legitimacy Assessment (3 questions)
  - question: Is crypto mining authorized on this system?
    context: |
      Check if this host is designated for legitimate mining operations.
      Many organizations prohibit crypto mining on corporate assets.
    range: -30d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30d
      # FIELD CHECK: hostname, CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - 'stratum+tcp://'
            - 'stratum+udp://'
            - '--donate-level='
            - '--nicehash'
            - '--algo=rx/0'
        condition: selection
      fields:
        - User
        - Image

  - question: What user account initiated the mining activity?
    context: |
      Service accounts or unexpected users running miners often indicate compromise.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: All alert fields available
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine

  - question: Is this activity occurring during normal business hours?
    context: |
      Crypto mining during off-hours might indicate unauthorized use or compromise.
    range: -7d
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -7d
      # FIELD CHECK: hostname, User, Image exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{event_data.user.name}'
          Image: '{event_data.process.executable}'
        condition: selection
      fields:
        - Image
        - CommandLine

  # Thread 2: Activity Context (4 questions)
  - question: What process launched the crypto miner?
    context: |
      Understanding the parent process helps identify the infection vector.
    range: -15m/+5m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -15m/+5m
      # FIELD CHECK: hostname, ProcessGuid exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          ProcessGuid: '{event_data.process.entity_id}'
        condition: selection
      fields:
        - Image
        - CommandLine
        - ParentImage
        - ParentCommandLine

  - question: Were any files downloaded before the mining started?
    context: |
      Miners are often downloaded via curl, wget, or other tools.
    range: -30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{event_data.user.name}'
          Image|contains:
            - 'wget'
            - 'curl'
            - 'git'
            - 'scp'
        condition: selection
      fields:
        - Image
        - CommandLine
        - User

  - question: What mining pool is being connected to?
    context: |
      Identifying the pool can help track campaign attribution.
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert (pulling from alert document)
      # RANGE CHECK: none (alert document access)
      # FIELD CHECK: CommandLine available in alert
      aggregation: false
      logsource:
        category: alert
      detection:
        selection:
          document_id: '{soc_id}'
        condition: selection
      fields:
        - CommandLine

  - question: Were any system modifications made to support mining?
    context: |
      Miners often load kernel modules or modify system settings.
    range: -30m/+30m
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -30m/+30m
      # FIELD CHECK: hostname exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - 'modprobe'
            - 'insmod'
            - 'sysctl'
            - 'hugepages'
            - 'msr allow_writes'
        condition: selection
      fields:
        - User
        - Image
        - CommandLine

  # Thread 3: Impact Assessment (3 questions)
  - question: What network connections has the miner established?
    context: |
      Mining pools require persistent connections for work distribution.
    range: -30m/+30m
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: -30m/+30m
      # FIELD CHECK: hostname, Image exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          hostname: '{event_data.host.name}'
          Image: '{event_data.process.executable}'
        condition: selection
      fields:
        - DestinationIp
        - DestinationPort

  - question: Are other systems showing similar mining activity?
    context: |
      Widespread mining might indicate worm-like propagation.
    range: -24h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -24h
      # FIELD CHECK: CommandLine exist in process_creation
      aggregation: true
      logsource:
        category: process_creation
      detection:
        selection:
          CommandLine|contains:
            - 'stratum+tcp://'
            - 'stratum+udp://'
            - '--donate-level='
            - 'xmrig'
        condition: selection
      fields:
        - hostname
        - User
        - Image

  - question: What is the resource consumption of the mining process?
    context: |
      High CPU usage confirms active mining and impact on system performance.
    range: -1h/+1h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h/+1h
      # FIELD CHECK: hostname exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - ' top'
            - ' htop'
            - ' ps aux'
            - '/proc/'
        condition: selection
      fields:
        - User
        - CommandLine

  # Thread 4: Investigative Deep-Dive (4 questions)
  - question: Was persistence established for the miner?
    context: |
      Attackers often ensure miners restart after reboots.
    range: -1h/+1h
    answer_sources:
      - file_event
    query: |
      # LOGSOURCE CHECK: file_event
      # RANGE CHECK: -1h/+1h
      # FIELD CHECK: hostname exist in file_event
      aggregation: false
      logsource:
        category: file_event
      detection:
        selection:
          hostname: '{event_data.host.name}'
          TargetFilename|contains:
            - '/etc/cron'
            - '/etc/systemd/system/'
            - '/.config/autostart/'
            - '/etc/init.d/'
            - '/.bashrc'
            - '/.profile'
        condition: selection
      fields:
        - User
        - TargetFilename
        - Image

  - question: Were security tools disabled or evaded?
    context: |
      Miners often kill security processes or modify firewall rules.
    range: -1h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -1h
      # FIELD CHECK: hostname exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - 'iptables'
            - 'ufw'
            - 'setenforce 0'
            - 'systemctl stop'
            - 'service.*stop'
            - 'pkill'
            - 'killall'
        condition: selection
      fields:
        - User
        - CommandLine

  - question: What was the initial access vector?
    context: |
      Understanding how the miner was introduced helps prevent reinfection.
    range: -6h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -6h
      # FIELD CHECK: hostname, User exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          User: '{event_data.user.name}'
          Image|contains:
            - 'sshd'
            - 'apache'
            - 'nginx'
            - 'httpd'
            - 'docker'
            - 'containerd'
        condition: selection
      fields:
        - Image
        - CommandLine
        - ParentImage

  - question: Were other malicious tools deployed alongside the miner?
    context: |
      Crypto miners are often part of larger compromises.
    range: -2h/+2h
    answer_sources:
      - process_creation
    query: |
      # LOGSOURCE CHECK: process_creation
      # RANGE CHECK: -2h/+2h
      # FIELD CHECK: hostname exist in process_creation
      aggregation: false
      logsource:
        category: process_creation
      detection:
        selection:
          hostname: '{event_data.host.name}'
          CommandLine|contains:
            - 'masscan'
            - 'nmap'
            - 'nc -e'
            - 'bash -i'
            - '/dev/tcp/'
            - 'base64 -d'
            - 'eval('
        condition: selection
      fields:
        - User
        - Image
        - CommandLine

  # Thread 5: Enterprise Context (2 questions)
  - question: Have similar mining indicators been detected across the environment?
    context: |
      Coordinated mining campaigns often target multiple systems.
    range: -7d
    answer_sources:
      - alert
    query: |
      # LOGSOURCE CHECK: alert
      # RANGE CHECK: -7d
      # FIELD CHECK: rule.name exist in alert
      aggregation: true
      logsource:
        category: alert
      detection:
        selection:
          rule.name: 'Linux Crypto Mining Indicators'
        condition: selection
      fields:
        - hostname
        - User

  - question: What is the scope of potential mining activity?
    context: |
      Understanding the breadth helps prioritize response efforts.
    range: -24h
    answer_sources:
      - network_connection
    query: |
      # LOGSOURCE CHECK: network_connection
      # RANGE CHECK: -24h
      # FIELD CHECK: DestinationPort exist in network_connection
      aggregation: true
      logsource:
        category: network_connection
      detection:
        selection:
          DestinationPort:
            - 3333
            - 4444
            - 5555
            - 8333
            - 9999
            - 14444
            - 45700
        condition: selection
      fields:
        - hostname
        - Image
        - DestinationIp