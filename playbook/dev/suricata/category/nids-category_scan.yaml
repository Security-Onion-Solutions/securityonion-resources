name: "ET SCAN Category Playbook"
id: 2f8a9b3c-e7d4-4f1a-b8c9-12345678abcd
description: |
    This playbook is designed to help investigate alerts from the ET SCAN category, which includes various types of network scanning activities such as port scans, service enumeration, vulnerability scanning, and brute force attempts.
type: detection
detection_id: '2003068'
detection_category: ''
detection_type: nids
contributors:
  - SecurityOnionSolutions
created: 2025-04-28
modified: 2025-04-28
questions:

  - question: 'Is the scanning system a known-good system?'
    context: 'Known-good systems may be authorized vulnerability scanners or maintenance tools.'
    answer_sources:
        - asset_inventory
    query: |
        aggregation: false
        logsource:
          category: alert
          product: suricata
        detection:
            selection:
                document_id|expand: '%document_id%'
            condition: selection
        fields:
            - host.name
            - src_ip

  - question: 'What type of scan is being detected?'
    context: 'Different scan types (e.g., service enumeration, vulnerability scan, reconnaissance) give context to the type of activity being detected.'
    answer_sources:
        - alert
    query: |
        aggregation: false
        logsource:
          category: alert
          product: suricata
        detection:
            selection:
                document_id|expand: '%document_id%'
            condition: selection
        fields:
            - rule.name
            - src_ip
            - src_port
            - dst_ip
            - dst_port

  - question: 'Is this part of a broader scanning campaign?'
    context: 'Multiple scan attempts from the same source across different targets or services may indicate a systematic reconnaissance effort.'
    answer_sources:
        - alert
    range: -1h
    query: |
        aggregation: true
        logsource:
          category: alert
          product: suricata
        detection:
            selection:
                src_ip|expand: '%src_ip%'
                rule.name|contains: 'SCAN'
            condition: selection
        fields:
            - rule.name
            - dst_ip
            - dst_port

  - question: 'What is the scanning pattern and frequency?'
    context: 'Understanding the scan pattern (sequential, random, targeted) and frequency helps determine if this is automated or manual scanning.'
    answer_sources:
        - network.connections
    range: -10m
    query: |
        aggregation: false
        logsource:
          category: network
          service: connection
        detection:
            selection:
                src_ip|expand: '%src_ip%'
            filter:
                connection.state: 'SF'
            condition: selection and not filter
        fields:
            - src_ip
            - dst_ip
            - dst_port
            - network.protocol
            - event.duration
            - client.ip_bytes
            - server.ip_bytes
            - connection.state_description

  - question: 'Are there any successful connections following the scan?'
    context: |
        Successful connections after scanning could indicate that vulnerabilities were found and potentially exploited.
    answer_sources:
        - zeek.conn
    range: +5m
    query: |
        aggregation: false
        logsource:
          category: network
          service: connection
        detection:
            selection:
                src_ip|expand: '%src_ip%'
                connection.state: 'SF'
            condition: selection
        fields:
            - src_ip
            - dst_ip
            - dst_port
            - network.protocol
            - event.duration
            - connection.history


  - question: 'What process is associated with this specific network connection?'
    context: 'Correlating process execution to the network connection can give further indication of intent.'
    answer_sources:
        - community_id
    query: |
        aggregation: false
        logsource:
          category: community_id
        detection:
            selection:
                community_id|expand: '%community_id%'
                event_dataset: 'endpoint.events.network'
            condition: selection
        fields:
            - hostname
            - Image
            - CommandLine

  - question: 'Are there any other alerts associated with the scanning system?'
    context: 'Previous malicious activity from the same source may indicate a persistent threat.'
    answer_sources:
        - alert
    range: -7d
    query: |
        aggregation: true
        logsource:
          category: alert
        detection:
            selection:
                - src_ip|expand: '%src_ip%'
                - dst_ip|expand: '%dst_ip%'
            condition: selection
        fields:
            - rule.type
            - rule.name



  - question: 'Is the scanning source associated with known threat intelligence?'
    context: 'Known malicious sources may require immediate blocking or escalation.'
    answer_sources:
        - threatintel
    query: |
        aggregation: false
        logsource:
          category: threatintel
        detection:
            selection:
                indicator|expand: '%src_ip%'
            condition: selection
        fields:
            - indicator
            - threat_type
            - confidence
            - source

  - question: 'Are there any associated DNS queries from the scanning source?'
    context: 'DNS queries before or during scanning may reveal reconnaissance patterns or C2 communication.'
    answer_sources:
        - dns
    range: -30m
    query: |
        aggregation: false
        logsource:
          category: network
          service: dns
        detection:
            selection:
                src_ip|expand: '%src_ip%'
            condition: selection
        fields:
            - dns.query.name
            - dns.query.type_name
            - dns.answers.name
            - dns.response.code_name