title: Security Onion - SOC Login Failures Across Many Accounts
id: 4562da34-5749-45be-9f28-6e5f710eb35d
status: experimental
description: |
    Detects failed SOC logins for 3 or more distinct usernames from one client address in 10
    minutes.
references:
    - https://attack.mitre.org/techniques/T1110/003/
license: Elastic-2.0
author: 'Security Onion Solutions'
date: 2026/09/30
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - so_soc_login_failure_spray
    group-by:
        - http.request.headers.x-real-ip
    timespan: 10m
    condition:
        field: User
        gte: 3
falsepositives:
    - Several analysts mistyping passwords behind one shared address (NAT, proxy)
    - One person trying several of their own usernames
summary: '%count% SOC accounts failed to log in from %http.request.headers.x-real-ip% in %duration%: %user.name%'
level: high
---
title: Security Onion - SOC Login Failure (Correlation Base, Many Accounts)
id: 58b90af8-2d75-49e8-83f4-b982a5e04632
name: so_soc_login_failure_spray
description: Failed SOC login.
logsource:
    product: kratos
    service: application
detection:
    selection:
        msg: 'Encountered self-service login error.'
    condition: selection
fields:
    - User
