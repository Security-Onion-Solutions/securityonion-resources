title: Many Distinct TXT Lookups Under One Domain From One Host
id: 0c5c5ca1-ee06-4df5-a523-bc11fe918ef9
status: experimental
description: |
    Detects one client making ten or more different TXT or NULL queries under the same registered
    domain within ten minutes. DNS command-and-control and exfiltration tools (dnscat2, Cobalt
    Strike and Sliver DNS listeners, iodine, DNSExfiltrator) carry data in unique subdomain labels
    and read replies from TXT records, so every query name is new. Ordinary clients ask for a
    handful of fixed TXT records (SPF, verification tokens, service configuration). Team Cymru
    malware-hash lookups made by Zeek are excluded.
references:
    - https://attack.mitre.org/techniques/T1071/004/
    - https://attack.mitre.org/techniques/T1048/
license: Elastic-2.0
author: 'Security Onion Solutions'
date: 2026/09/30
tags:
    - attack.command-and-control
    - attack.exfiltration
    - attack.t1071.004
    - attack.t1048
correlation:
    type: value_count
    rules:
        - so_dns_txt_query
    group-by:
        - src_ip
        - dns.highest_registered_domain
    timespan: 10m
    condition:
        field: query
        gte: 10
falsepositives:
    - Security tooling that looks up file hashes or reputation over DNS (add its domain to the filter)
    - Mail servers checking DKIM or DMARC records for many sender subdomains of one provider
summary: '%source.ip% made %count% different TXT lookups under %dns.highest_registered_domain% in %duration% (resolver %destination.ip%)'
level: high
---
title: DNS TXT Or NULL Query
id: c7226c28-01af-4001-8f78-32c1855567c5
name: so_dns_txt_query
description: Base event -- a TXT or NULL record lookup that is not a Team Cymru hash lookup.
logsource:
    category: network
    service: dns
detection:
    selection:
        dns.query.type_name:
            - 'TXT'
            - 'NULL'
    filter_cymru:
        query|endswith: '.hash.cymru.com'
    condition: selection and not filter_cymru
fields:
    - dst_ip
