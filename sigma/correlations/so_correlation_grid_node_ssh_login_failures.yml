title: Security Onion - Repeated Grid Node Login Failures (SSH)
id: 36f6dd17-5b13-427a-a56f-c3903800cf61
status: experimental
description: |
    Detects 10 or more failed SSH logins to grid nodes from one source address in 10 minutes.
    Each wrong password counts, including several tries on one connection. A nonexistent
    username adds one event per connection. OpenSSH 9.8 and later refuses connections from a
    source after repeated failures (PerSourcePenalties). Refused connections are not logged as
    failed logins, so the count can be lower than the number of attempts.
references:
    - https://attack.mitre.org/techniques/T1110/001/
license: Elastic-2.0
author: 'Security Onion Solutions'
date: 2026/09/30
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - so_grid_node_ssh_login_failure
    group-by:
        - src_ip
    timespan: 10m
    condition:
        gte: 10
falsepositives:
    - Vulnerability scanners running credentialed SSH checks
summary: '%count% failed SSH logins to %host.name% from %source.ip% in %duration% (accounts: %user.name%)'
level: high
---
title: Security Onion - Grid Node Login Failure (SSH, Correlation Base)
id: 17e12477-00be-4369-bd5e-190be6fe806b
name: so_grid_node_ssh_login_failure
description: Failed SSH login to a grid node.
logsource:
    product: linux
    service: auth
detection:
    selection:
        event.outcome: 'failure'
        event.action: 'ssh_login'
        tags: 'so-grid-node'
    condition: selection
fields:
    - hostname
    - User
