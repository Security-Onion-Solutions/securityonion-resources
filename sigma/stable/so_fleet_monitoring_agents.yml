title: 'Elastic Agent seen offline longer than configured threshold'
id: 9a2dde59-8024-4749-b51c-f7364c59d485
status: 'experimental'
description: |
    This rule looks for agents that have been in an OFFLINE or DEGRADED state for longer than the configured threshold. Threshold is configured via SOC -> Administration -> Configuration -> manager -> agent_monitoring -> config -> offline_threshold"
author: 'Security Onion Solutions'
date: '2025/09/04'
logsource:
    product: fleet
    service: health
detection:
    selection_dataset:
        event.dataset: gridmetrics.agents
    selection_status:
        agent.status:
            - offline
            - degraded
    condition: selection_dataset and selection_status
level: 'high'
